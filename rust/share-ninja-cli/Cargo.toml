[package]
name = "share-ninja-cli"
version = "1.1.0"
edition = "2024"
description = "sninja: the Share.Ninja command line — secure file transfers, and the commander TUI (`sninja cmd`)"
license = "Apache-2.0"

[[bin]]
name = "sninja"
path = "src/main.rs"

[dependencies]
share-ninja-core = { path = "../share-ninja-core" }
share-ninja-client = { workspace = true }
# The commander TUI (`sninja cmd`).
share-ninja-commander = { path = "../share-ninja-commander" }

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
dirs = "7.0.0"
toml = "1.1.2"

# Error handling
anyhow = "1"
thiserror = "2.0"

# Output formatting
colored = "3.1.1"
indicatif = "0.18.4"

# Crypto provider for rustls (WebRTC DTLS + reqwest/tungstenite TLS): `ring`,
# installed as the process default in main. No default features — those would
# pull aws-lc-rs back in.
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Date/time
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Utilities
uuid = { version = "1.19", features = ["v4"] }
# `get --filter` glob matching over share keys
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
rand = "0.10.1"

# Default `v1` feature = the Entry/get_password/set_password API over the native
# stores (macOS Keychain, Windows Credential Manager, Linux secret-service via
# zbus) — same as the desktop shell.
